    <g transform="translate(60,350)">
      <path d="M14 4a16 16 0 0 1 16 16c0 8-5 11-7 16H21c-2-5-7-8-7-16A16 16 0 0 1 14 4z"/>
      <line x1="9" y1="40" x2="19" y2="40"/>
      <line x1="10" y1="45" x2="18" y2="45"/>
    </g>

    <!-- Reloj -->
    <g transform="translate(180,350)">
      <circle cx="20" cy="20" r="20"/>
      <line x1="20" y1="20" x2="20" y2="8"/>
      <line x1="20" y1="20" x2="29" y2="24"/>
