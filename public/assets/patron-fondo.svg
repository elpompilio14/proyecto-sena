<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520" viewBox="0 0 520 520">
  <g fill="none" stroke="#dbe2ea" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

    <!-- Regla -->
    <g transform="translate(30,40) rotate(-12)">
      <rect x="0" y="0" width="90" height="22" rx="3"/>
      <line x1="12" y1="0" x2="12" y2="10"/>
      <line x1="24" y1="0" x2="24" y2="14"/>
      <line x1="36" y1="0" x2="36" y2="10"/>
      <line x1="48" y1="0" x2="48" y2="14"/>
      <line x1="60" y1="0" x2="60" y2="10"/>
      <line x1="72" y1="0" x2="72" y2="14"/>
