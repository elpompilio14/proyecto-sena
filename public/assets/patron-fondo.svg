      <line x1="0" y1="12" x2="42" y2="12"/>
      <circle cx="8" cy="6" r="1.6"/>
      <circle cx="8" cy="19" r="1.6"/>
      <circle cx="8" cy="30" r="1.6"/>
      <circle cx="8" cy="41" r="1.6"/>
