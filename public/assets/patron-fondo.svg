      <rect x="7" y="7" width="26" height="10" rx="2"/>
      <circle cx="11" cy="28" r="2.3"/>
      <circle cx="20" cy="28" r="2.3"/>
      <circle cx="29" cy="28" r="2.3"/>
      <circle cx="11" cy="38" r="2.3"/>
      <circle cx="20" cy="38" r="2.3"/>
      <circle cx="29" cy="38" r="2.3"/>
      <circle cx="11" cy="46" r="2.3"/>
      <circle cx="20" cy="46" r="2.3"/>
      <circle cx="29" cy="46" r="2.3"/>
