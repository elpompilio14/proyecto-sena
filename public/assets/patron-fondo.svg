    <g transform="translate(400,360)">
      <path d="M16 0 20 11 32 11 22 18 26 30 16 22 6 30 10 18 0 11 12 11z"/>
    </g>

    <!-- Sombrero de birrete pequeno extra -->
    <g transform="translate(430,440)">
      <path d="M14 0 28 7 14 14 0 7z"/>
      <path d="M7 9v9c0 3 4 5 7 5s7-2 7-5V9"/>
