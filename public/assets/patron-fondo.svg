    <g transform="translate(300,150) rotate(8)">
      <path d="M0 50 L0 0 L50 50 Z"/>
      <line x1="8" y1="42" x2="15" y2="42"/>
      <line x1="8" y1="32" x2="18" y2="32"/>
      <line x1="8" y1="22" x2="15" y2="22"/>
