    <!-- Signo de interrogacion -->
    <g transform="translate(190,20)">
      <circle cx="20" cy="20" r="22"/>
      <path d="M13 14c0-6 6-9 10-9 6 0 10 3 10 8 0 6-9 7-9 15"/>
      <line x1="24" y1="34" x2="24" y2="34.5"/>
