{% extends "base.html" %}
{% block content %}

<p><a href="/admin/grupos-estudiantiles">&larr; Grupos Estudiantiles</a></p>
<h1>Editar grupo</h1>

<form method="POST" action="/admin/grupos-estudiantiles/{{ grupo.id }}/editar" class="form" enctype="multipart/form-data">
    <label>Nombre<input type="text" name="nombre" value="{{ grupo.nombre }}" required></label>
    <label>Encargado (docente o estudiante líder)<input type="text" name="encargado" value="{{ grupo.encargado or '' }}"></label>
    <label>Descripción<textarea name="descripcion" rows="3">{{ grupo.descripcion or '' }}</textarea></label>
    {% if grupo.foto_url %}
        <img src="{{ grupo.foto_url }}" alt="Foto actual" class="card-img">
    {% endif %}
    <label>Cambiar foto (opcional)<input type="file" name="imagen" accept="image/*"></label>
    <input type="hidden" name="foto_actual" value="{{ grupo.foto_url or '' }}">
    <button type="submit">Guardar cambios</button>
</form>

{% endblock %}
