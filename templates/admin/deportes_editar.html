{% extends "base.html" %}
{% block content %}

<p><a href="/admin/deportes">&larr; Deportes</a></p>
<h1>Editar deporte</h1>

<form method="POST" action="/admin/deportes/{{ deporte.id }}/editar" class="form" enctype="multipart/form-data">
    <label>Nombre<input type="text" name="nombre" value="{{ deporte.nombre }}" required></label>
    {% if deporte.imagen_url %}
        <img src="{{ deporte.imagen_url }}" alt="Imagen actual" class="card-img">
    {% endif %}
    <label>Cambiar imagen (opcional)<input type="file" name="imagen" accept="image/*"></label>
    <input type="hidden" name="imagen_actual" value="{{ deporte.imagen_url or '' }}">
    <label>Descripción (para la página del deporte)<textarea name="descripcion" rows="4">{{ deporte.descripcion or '' }}</textarea></label>
    <button type="submit">Guardar cambios</button>
</form>

{% endblock %}
