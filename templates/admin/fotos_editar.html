{% extends "base.html" %}
{% block content %}

<p><a href="/admin/fotos">&larr; Galería</a></p>
<h1>Editar foto</h1>

<form method="POST" action="/admin/fotos/{{ foto.id }}/editar" class="form" enctype="multipart/form-data">
    <label>Título (opcional)<input type="text" name="titulo" value="{{ foto.titulo or '' }}"></label>
    <label>Fecha (se usa para agrupar por mes en la galería)<input type="date" name="fecha" value="{{ foto.fecha }}"></label>
    <label>Orden dentro del evento/noticia (los números más bajos salen primero; si empatan, se ordenan por como se subieron. Usa 0 para dejarla de primera)<input type="number" name="orden" value="{{ foto.orden }}"></label>
    {% if esVideo(foto.url) %}
        <video src="{{ foto.url }}" controls class="card-img"></video>
    {% else %}
        <img src="{{ foto.url }}" alt="Foto actual" class="card-img">
    {% endif %}
    <label>Cambiar archivo (opcional)<input type="file" name="imagen" accept="image/*,video/*"></label>
    <input type="hidden" name="url_actual" value="{{ foto.url }}">
    <label>
        Evento relacionado (opcional)
        <select name="evento_id">
            <option value="">-- Ninguno --</option>
            {% for ev in eventos %}
                <option value="{{ ev.id }}" {{ 'selected' if foto.evento_id == ev.id else '' }}>{{ ev.titulo }}</option>
            {% endfor %}
        </select>
    </label>
    <label>
        Noticia relacionada (opcional)
        <select name="noticia_id">
            <option value="">-- Ninguna --</option>
            {% for n in noticias %}
                <option value="{{ n.id }}" {{ 'selected' if foto.noticia_id == n.id else '' }}>{{ n.titulo }}</option>
            {% endfor %}
        </select>
    </label>
    <label>
        Categoría de Media Técnica relacionada (opcional)
        <select name="media_tecnica_categoria_id">
            <option value="">-- Ninguna --</option>
            {% for c in categoriasMediaTecnica %}
                <option value="{{ c.id }}" {{ 'selected' if foto.media_tecnica_categoria_id == c.id else '' }}>{{ c.nombre }}</option>
            {% endfor %}
        </select>
    </label>
    <label>
        Sección relacionada (opcional)
        <select name="seccion">
            <option value="">-- Ninguna --</option>
            {% for clave, nombre in secciones.items() %}
                <option value="{{ clave }}" {{ 'selected' if foto.seccion == clave else '' }}>{{ nombre }}</option>
            {% endfor %}
        </select>
    </label>
    <button type="submit">Guardar cambios</button>
</form>

{% endblock %}
