{% extends "base.html" %}
{% block content %}

<p><a href="/admin/grados">&larr; Grados</a></p>
<h1>Editar curso</h1>

<form method="POST" action="/admin/grados/{{ grado.id }}/editar" class="form">
    <label>Nombre del curso<input type="text" name="nombre" value="{{ grado.nombre }}" required></label>
    <label>Grado<input type="number" name="nivel" min="1" max="13" value="{{ grado.nivel }}" required></label>
    <button type="submit">Guardar cambios</button>
</form>

{% endblock %}
