{% extends "base.html" %}
{% block content %}

<p><a href="/admin/comite-ecologico">&larr; Comité Ecológico</a></p>
<h1>Editar miembro</h1>

<form method="POST" action="/admin/comite-ecologico/{{ miembro.id }}/editar" class="form" enctype="multipart/form-data">
    <label>Nombre<input type="text" name="nombre" value="{{ miembro.nombre }}" required></label>
    <label>Rol<input type="text" name="rol" value="{{ miembro.rol or '' }}"></label>
    <label>Salón (opcional, ej: 11-A)<input type="text" name="salon" value="{{ miembro.salon or '' }}"></label>
    {% if miembro.foto_url %}
        <img src="{{ miembro.foto_url }}" alt="Foto actual" class="card-img">
    {% endif %}
    <label>Cambiar foto (opcional)<input type="file" name="imagen" accept="image/*" data-recorte="circulo" data-recorte-aspecto="1"></label>
    <input type="hidden" name="foto_actual" value="{{ miembro.foto_url or '' }}">
    <label>Orden (los números más bajos salen primero; si empatan, se ordenan por nombre)<input type="number" name="orden" value="{{ miembro.orden }}"></label>
    <label>Nivel en la pirámide
        <select name="nivel">
            <option value="punta" {{ 'selected' if miembro.nivel == 'punta' else '' }}>Punta (arriba de todo)</option>
            <option value="medio" {{ 'selected' if miembro.nivel == 'medio' else '' }}>Medio</option>
            <option value="base" {{ 'selected' if miembro.nivel == 'base' else '' }}>Base</option>
        </select>
    </label>
    <button type="submit">Guardar cambios</button>
</form>

{% endblock %}
